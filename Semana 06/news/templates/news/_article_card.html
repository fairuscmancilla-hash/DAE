<article class="card article-card" data-search="{{ article.title }} {{ article.summary }} {% for category in article.categories.all %}{{ category.name }} {% endfor %}">
<a class="card-media" href="{{ article.get_absolute_url }}" aria-label="Leer {{ article.title }}">{% if article.featured_image %}<img class="card-image" src="{{ article.featured_image.url }}" alt="{{ article.title }}" loading="lazy">{% else %}<span class="image-placeholder" aria-hidden="true">N</span>{% endif %}</a>
<div class="card-body"><p class="card-categories">{% for category in article.categories.all %}<a class="tag" href="{{ category.get_absolute_url }}">{{ category.name }}</a>{% empty %}<span class="tag tag-empty">General</span>{% endfor %}</p><h3 class="card-title"><a href="{{ article.get_absolute_url }}">{{ article.title }}</a></h3><p class="card-summary">{{ article.summary|truncatewords:20|capfirst }}</p><div class="card-meta"><span>{{ article.author.full_name }}</span><time datetime="{{ article.published_at|date:'c' }}">{{ article.published_at|date:"d/m/Y" }}</time></div></div>
</article>
