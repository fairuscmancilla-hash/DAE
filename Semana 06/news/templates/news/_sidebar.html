<section class="panel categories-panel"><div class="panel-heading"><span class="panel-icon" aria-hidden="true">#</span><h2>Explorar temas</h2></div><ul class="category-list">{% for category in categories %}<li><a href="{{ category.get_absolute_url }}">{{ category.name }}</a><span class="count">{{ category.articles.count }}</span></li>{% empty %}<li>No hay categorías todavía.</li>{% endfor %}</ul></section>
<section class="panel about-panel"><span class="eyebrow">Nuestra misión</span><h2>Información con contexto</h2><p>{{ site.tagline|default:"Noticias claras, relevantes y cerca de ti." }}</p></section>
